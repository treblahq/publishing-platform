name: Deploy production candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publishing-platform-production-candidate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preflight protected credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node tooling/staging-credentials.mjs
      - run: npm ci
      - run: npm run validate
      - name: Build ephemeral production configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node tooling/hydrate-production-config.mjs apps/worker/wrangler.json /tmp/publishing-platform-production.json
      - run: node tooling/production-readiness.mjs /tmp/publishing-platform-production.json
      - name: Verify deploy bundle locally
        run: npx wrangler deploy --dry-run --env production --config /tmp/publishing-platform-production.json --outdir /tmp/publishing-platform-production-bundle
      - name: Install Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$PRODUCER_SIGNING_SECRET"
          test -n "$ADMIN_TOKEN"
          node -e 'process.stdout.write(JSON.stringify({"openings-preview": process.env.PRODUCER_SIGNING_SECRET}))' | npx wrangler secret put PRODUCER_SECRETS --env production --config /tmp/publishing-platform-production.json
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --env production --config /tmp/publishing-platform-production.json
      - name: Apply existing schema migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply publishing-platform-staging --remote --env production --config /tmp/publishing-platform-production.json
      - name: Deploy production candidate Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --config /tmp/publishing-platform-production.json
      - name: Verify live endpoint without writes
        run: >-
          node --input-type=module -e "const response = await fetch('https://publishing-platform-production.business-850.workers.dev/health/live');
          const body = await response.json();
          if (!response.ok || body.status !== 'live') throw new Error('Production candidate Worker is not live');"
