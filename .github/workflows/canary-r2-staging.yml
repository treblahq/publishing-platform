name: Canary R2 staging

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing Openings job ID
        required: true
      job_title:
        description: Exact Openings job title
        required: true

permissions:
  contents: read

jobs:
  canary:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node tooling/r2-canary-staging.mjs
        env:
          STAGING_BASE_URL: https://publishing-platform-staging.business-850.workers.dev
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CANARY_JOB_ID: ${{ inputs.job_id }}
          CANARY_JOB_TITLE: ${{ inputs.job_title }}
