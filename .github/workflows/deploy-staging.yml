name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publishing-platform-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preflight staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node tooling/staging-credentials.mjs
      - run: npm ci
      - run: npm run validate
      - name: Build ephemeral staging configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node tooling/hydrate-staging-config.mjs apps/worker/wrangler.json /tmp/publishing-platform-wrangler.json
      - run: node tooling/staging-readiness.mjs /tmp/publishing-platform-wrangler.json
      - name: Verify deploy bundle locally
        run: npx wrangler deploy --dry-run --env staging --config /tmp/publishing-platform-wrangler.json --outdir /tmp/publishing-platform-bundle
      - name: Install staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$PRODUCER_SIGNING_SECRET"
          test -n "$ADMIN_TOKEN"
          node -e 'process.stdout.write(JSON.stringify({"openings-preview": process.env.PRODUCER_SIGNING_SECRET}))' | npx wrangler secret put PRODUCER_SECRETS --env staging --config /tmp/publishing-platform-wrangler.json
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --env staging --config /tmp/publishing-platform-wrangler.json
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply publishing-platform-staging --remote --env staging --config /tmp/publishing-platform-wrangler.json
      - name: Bootstrap isolated staging tenant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          PRODUCER_CLIENT_ID: openings-preview
        run: |
          node tooling/bootstrap-staging.mjs > /tmp/publishing-platform-staging.sql
          npx wrangler d1 execute publishing-platform-staging --remote --env staging --config /tmp/publishing-platform-wrangler.json --file /tmp/publishing-platform-staging.sql
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --config /tmp/publishing-platform-wrangler.json
