name: Canary OneSignal staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEND ONE OPENINGS CANARY
        required: true
        type: string
      job_id:
        description: Existing job ID verified on the Openings Pages preview
        required: true
        type: string
      job_title:
        description: Notification body shown only to the canary segment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publishing-platform-staging
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate explicit canary scope
        env:
          CONFIRM_CANARY: ${{ inputs.confirmation }}
        run: test "$CONFIRM_CANARY" = 'SEND ONE OPENINGS CANARY'
      - run: npm ci
      - name: Build canary dependencies
        run: npm run build --workspace @treblahq/publishing-contracts && npm run build --workspace @treblahq/publishing-client
      - name: Send and verify one isolated canary
        env:
          CONFIRM_CANARY: ${{ inputs.confirmation }}
          CANARY_JOB_ID: ${{ inputs.job_id }}
          CANARY_JOB_TITLE: ${{ inputs.job_title }}
          STAGING_BASE_URL: https://publishing-platform-staging.business-850.workers.dev
          PRODUCER_SIGNING_SECRET: ${{ secrets.PRODUCER_SIGNING_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node tooling/canary-staging.mjs
      - name: Enforce paused state
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: >-
          curl --fail --silent --show-error --request POST
          --header "Authorization: Bearer $ADMIN_TOKEN"
          --header "Content-Type: application/json"
          --data '{"reason":"OneSignal canary workflow safety close"}'
          https://publishing-platform-staging.business-850.workers.dev/admin/adapters/openings/push.onesignal/pause
